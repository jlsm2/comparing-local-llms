<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Cabeca do cachorro -->
  <circle cx="50" cy="30" r="20" stroke="#FF0000" stroke-width="5" fill="#FFFFFF"/>

  <!-- Olhos do cachorro -->
  <circle cx="40" cy="45" r="10" stroke="#000000" stroke-width="2" fill="#FFFFFF"/>
  <circle cx="60" cy="45" r="10" stroke="#000000" stroke-width="2" fill="#FFFFFF"/>

  <!-- Nariz do cachorro -->
  <line x1="50" y1="40" x2="52" y2="42" stroke="#FF0000" stroke-width="3"/>
  <circle cx="51" cy="41" r="5" fill="#FF0000"/>

  <!-- Corpo do cachorro -->
  <rect x="20" y="50" width="100" height="40" stroke="#FF0000" stroke-width="3" fill="#FFFFFF"/>

  <!-- Pata do cachorro -->
  <rect x="25" y="70" width="50" height="30" stroke="#FF0000" stroke-width="3" fill="#FFFFFF"/>
</svg>
