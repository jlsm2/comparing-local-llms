<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Corpo do pelicano -->
  <circle cx="50" cy="70" r="30" fill="#964B00" />

  <!-- Cabeça e rosto -->
  <circle cx="60" cy="40" r="10" fill="#964B00" />
  <ellipse cx="55" cy="45" rx="15" ry="5" fill="#964B00" />

  <!-- Orelhas -->
  <circle cx="70" cy="50" r="5" fill="#964B00" />
  <circle cx="40" cy="50" r="5" fill="#964B00" />

  <!-- Braco esquerdo -->
  <line x1="60" y1="80" x2="30" y2="120" stroke="#964B00" />

  <!-- Braco direito -->
  <line x1="60" y1="80" x2="90" y2="120" stroke="#964B00" />

  <!-- Pedal esquerdo -->
  <circle cx="30" cy="130" r="10" fill="#964B00" />

  <!-- Pedal direito -->
  <circle cx="90" cy="130" r="10" fill="#964B00" />

  <!-- Roda esquerda -->
  <circle cx="25" cy="150" r="30" fill="#000" />

  <!-- Roda direita -->
  <circle cx="105" cy="150" r="30" fill="#000" />
</svg>
