<svg width="240" height="220" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
  <!-- ground shadow -->
  <ellipse cx="120" cy="205" rx="70" ry="8" fill="#eee"/>

  <!-- tail -->
  <path d="M 175 140 Q 200 130 195 105" fill="none" stroke="#8e44ad" stroke-width="10" stroke-linecap="round"/>

  <!-- back legs -->
  <rect x="150" y="165" width="12" height="35" rx="5" fill="#7d3c98"/>
  <rect x="170" y="165" width="12" height="35" rx="5" fill="#6c3483"/>

  <!-- body -->
  <ellipse cx="135" cy="150" rx="55" ry="32" fill="#9b59b6" stroke="#6c3483" stroke-width="2"/>

  <!-- front legs -->
  <rect x="90" y="170" width="12" height="35" rx="5" fill="#7d3c98"/>
  <rect x="110" y="170" width="12" height="35" rx="5" fill="#6c3483"/>

  <!-- neck -->
  <rect x="65" y="120" width="26" height="35" rx="10" fill="#9b59b6" stroke="#6c3483" stroke-width="2"/>

  <!-- head -->
  <circle cx="60" cy="105" r="30" fill="#a569bd" stroke="#6c3483" stroke-width="2"/>
  <!-- snout -->
  <ellipse cx="35" cy="112" rx="16" ry="11" fill="#bb8fce"/>
  <circle cx="20" cy="110" r="3.5" fill="#222"/>
  <!-- ears -->
  <path d="M 45 82 Q 35 60 50 68 Z" fill="#7d3c98"/>
  <path d="M 75 82 Q 85 60 70 68 Z" fill="#7d3c98"/>
  <!-- eye -->
  <circle cx="55" cy="98" r="4" fill="#222"/>
  <circle cx="56.5" cy="96.5" r="1.2" fill="#fff"/>

  <!-- helmet: dome + strap + vents, sits above head -->
  <path d="M 30 92 A 33 30 0 0 1 92 90 L 92 96 L 30 96 Z" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <path d="M 30 92 A 33 30 0 0 1 92 90" fill="none" stroke="#b7950b" stroke-width="1"/>
  <rect x="55" y="66" width="8" height="14" rx="2" fill="#e67e22" transform="rotate(-8 59 73)"/>
  <path d="M 40 96 Q 35 112 45 118" fill="none" stroke="#b7950b" stroke-width="3" stroke-linecap="round"/>
</svg>
